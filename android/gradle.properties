# Project-wide Gradle settings.
# IDE settings can override values in this file.
# https://docs.gradle.org/current/userguide/build_environment.html

# Android compatibility.
android.defaults.buildfeatures.buildconfig=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.useAndroidX=true

# Keep release builds within the GitHub Actions memory budget.
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=false
org.gradle.workers.max=2

# Gradle and Kotlin memory.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Duser.language=en -Duser.country=US -Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Stable UTF-8 behavior in local and CI builds.
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
