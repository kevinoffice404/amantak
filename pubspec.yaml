name: amantak2
description: نظام لإدارة أفراد الأمن والحضور والانصراف والعهد والجزاءات والرواتب.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  # ============================================================
  # الصور والملفات
  # ============================================================
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1

  # ============================================================
  # قاعدة البيانات المحلية
  # ============================================================
  sqflite: ^2.4.2+1

  # ============================================================
  # التقارير Excel / PDF / المشاركة
  # ============================================================
  excel: 4.0.6
  share_plus: 10.1.4
  pdf: 3.12.0
  printing: 5.14.3

  # ============================================================
  # Firebase
  # ============================================================
  firebase_core: 3.15.2
  cloud_firestore: 5.6.12
  firebase_storage: 12.4.10
  cloud_functions: 5.6.2
  firebase_app_check: 0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/
