name: amantak2
description: نظام لإدارة أفراد الأمن والحضور والانصراف والعهد والجزاءات والرواتب.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  # ============================================================
  # الصور والملفات
  # ============================================================
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1

  # ============================================================
  # قاعدة البيانات المحلية
  # ============================================================
  sqflite: ^2.4.2+1

  # ============================================================
  # Excel / PDF / مشاركة الملفات
  # ============================================================
  excel: ^4.0.6
  share_plus: ^9.0.0

  # تم تحديثهما لحل مشكلة Android compileSdk 30
  pdf: ^3.13.0
  printing: ^5.15.0

  # ============================================================
  # Firebase
  # ============================================================
  firebase_core: ^2.30.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0

  # ============================================================
  # OCR
  # ============================================================
  google_mlkit_text_recognition: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  # ضروري بسبب gen_localizations
  generate: true

  uses-material-design: true

  # لا نحذف مجلد الخطوط
  assets:
    - assets/fonts/
